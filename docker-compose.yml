name: autoblog-studio
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoblog_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-autoblog}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    restart: unless-stopped
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autoblog}:${POSTGRES_PASSWORD:-autoblog_local_only}@postgres:5432/${POSTGRES_DB:-autoblog}?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["uploaded_originals:/app/uploads"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
      target: build
    env_file: .env
    command:
      ["sh", "-c", "node scripts/prisma.mjs migrate deploy && npm run db:seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autoblog}:${POSTGRES_PASSWORD:-autoblog_local_only}@postgres:5432/${POSTGRES_DB:-autoblog}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    command: npm run worker -w backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autoblog}:${POSTGRES_PASSWORD:-autoblog_local_only}@postgres:5432/${POSTGRES_DB:-autoblog}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      backend: { condition: service_healthy }
  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:4000
    ports: ["127.0.0.1:3100:3100"]
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
  uploaded_originals:
